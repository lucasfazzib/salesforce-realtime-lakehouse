resources:
  jobs:
    silver_opportunity:
      name: salesforce-opportunity-silver-current-state
      description: Apply Opportunity CDC events to the Silver current-state table
      max_concurrent_runs: 1
      tasks:
        - task_key: merge_opportunity_current_state
          spark_python_task:
            python_file: ../src/databricks/silver_opportunity.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${var.schema}
              - --bronze-table
              - ${var.bronze_table}
              - --silver-schema
              - ${var.silver_schema}
              - --silver-table
              - ${var.silver_table}
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 30000
      environments:
        - environment_key: default
          spec:
            environment_version: "4"