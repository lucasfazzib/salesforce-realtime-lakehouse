resources:
  jobs:
    bronze_ingestion:
      name: salesforce-cdc-bronze-ingestion
      description: Ingest Salesforce Opportunity CDC JSON files into Bronze Delta
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_opportunity_cdc
          spark_python_task:
            python_file: ../src/databricks/bronze_ingestion.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --table
              - ${var.bronze_table}
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 30000
      environments:
        - environment_key: default
          spec:
            environment_version: "4"