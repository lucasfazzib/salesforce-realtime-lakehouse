name: Deploy PROD-SIMULATED

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-production-simulated
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Databricks PROD-SIMULATED
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DATABRICKS_AUTH_TYPE: pat
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Enforce main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.16.1

      - name: Verify Databricks credentials are configured
        run: test -n "$DATABRICKS_HOST" && test -n "$DATABRICKS_TOKEN"

      - name: Validate PROD-SIMULATED bundle
        run: databricks bundle validate --target prod

      - name: Deploy PROD-SIMULATED bundle
        run: databricks bundle deploy --target prod