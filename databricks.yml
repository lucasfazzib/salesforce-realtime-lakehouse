# This is a Declarative Automation Bundle definition for salesforce-realtime-lakehouse.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: salesforce-realtime-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the project
    default: salesforce_realtime_lakehouse
  schema:
    description: Unity Catalog schema for Bronze assets
    default: bronze
  volume:
    description: Unity Catalog Volume for Salesforce CDC landing and state
    default: salesforce_cdc_landing
  bronze_table:
    description: Bronze Delta table name
    default: opportunity_cdc

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-403e1b97-45df.cloud.databricks.com
