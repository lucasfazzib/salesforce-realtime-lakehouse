# This is a Declarative Automation Bundle definition for salesforce-realtime-lakehouse.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: salesforce-realtime-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the project
    default: salesforce_realtime_lakehouse
  schema:
    description: Unity Catalog schema for Bronze assets
    default: bronze
  volume:
    description: Unity Catalog Volume for Salesforce CDC landing and state
    default: salesforce_cdc_landing
  bronze_table:
    description: Bronze Delta table name
    default: opportunity_cdc
  silver_schema:
    description: Unity Catalog schema for Silver assets
    default: silver
  silver_table:
    description: Silver Opportunity current-state table name
    default: opportunity

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-403e1b97-45df.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: bronze
      volume: salesforce_cdc_landing
      silver_schema: silver
  prod:
    mode: production
    workspace:
      host: https://dbc-403e1b97-45df.cloud.databricks.com
      root_path: /Workspace/production/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: "[PROD-SIMULATED] "
      tags:
        environment: prod-simulated
    variables:
      schema: bronze_prod
      volume: salesforce_cdc_landing_prod
      silver_schema: silver_prod
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
